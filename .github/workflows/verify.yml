name: Verify public overview

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify product truth
        run: node tests/product-truth-contract.mjs
      - name: Verify architecture
        run: node tests/architecture-contract.mjs
